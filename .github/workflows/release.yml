# 공식 릴리스 빌드 — v* 태그 푸시로만 발동.
#
# 여기가 MAIN_VITE_OFFICIAL=1의 **유일한 공식 통로**다: 게이트(체험·라이선스) 없는 빌드가
# 판매 채널에 올라가는 사고를 사람 주의력이 아니라 이 파일이 막는다.
#
# 보안 설계:
#  - fork PR에는 secrets가 주입되지 않고, 태그 푸시는 write 권한자만 가능하다
#  - 서드파티 액션 금지(공급망 최소화) — 공식 actions/* 와 러너 내장 gh CLI만 쓴다
#  - 서명·공증 secrets는 빌드 스텝에만 주입한다 — npm ci(postinstall 스크립트 실행)가
#    자격증명 env를 볼 수 없게 범위를 좁힌다
#
# 결과물은 **draft 릴리스** — 사람이 확인하고 publish 버튼을 누른다(비가역 액션 컨펌, SPEC §3).
# publish해야 /releases/latest/download 가 새 버전을 가리키고 자동 업데이트가 흐른다.
#
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   MAC_CERT_P12              Developer ID Application 인증서 .p12의 base64
#   MAC_CERT_PASSWORD         .p12 내보내기 암호
#   APPLE_ID                  공증용 Apple ID (이메일)
#   APPLE_APP_SPECIFIC_PASSWORD  앱 암호 (appleid.apple.com에서 발급, 스코프 제한·폐기 가능)
#   APPLE_TEAM_ID             개발자 팀 ID
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build, sign & notarize (official)
        env:
          MAIN_VITE_OFFICIAL: '1'
          # 자동 업데이트 채널 — GitHub Releases의 "latest" 고정 URL (publish된 최신 릴리스를 따라감)
          ZTO_UPDATE_URL: https://github.com/DanialDaeHyunNam/zto/releases/latest/download
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac -- --publish never

      - name: Checksums
        run: cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt

      # draft로 만든다 — 자산 확인 후 사람이 publish. 재실행 시엔 기존 draft에 덮어 올린다
      - name: Draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "ZTO $GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release/*.dmg release/*.zip release/*.blockmap \
            release/latest-mac.yml release/SHA256SUMS.txt

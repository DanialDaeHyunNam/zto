# ZTO 패키징 — mac(서명·공증) / win
#
# ⚠️ 공식 릴리스는 반드시 `npm run dist:mac:official`(= MAIN_VITE_OFFICIAL=1)로 빌드한다.
#    이 플래그가 만료 게이트를 켠다 — 없이 빌드하면 게이트 없는 '소스 빌드'가 나가서
#    체험·라이선스가 전부 무의미해진다. (win은 빌드 전 환경변수로 직접 설정)
#
# ⚠️ 핵심 두 가지가 이 파일에 걸려 있다:
#  ① `launch/scripts`·`launch/questionnaires`는 **asar 밖**(extraResources)이어야 한다.
#     스크립트는 별도 프로세스(ELECTRON_RUN_AS_NODE)로 실행되므로 아카이브 안에 있으면 못 찾는다.
#  ② 답안 시트(answers)는 **번들에 넣지 않는다**. 쓰기 대상이라 userData로 가고(main이 처리),
#     애초에 앱별 정보를 배포물에 담지 않는다는 원칙(SPEC §7.3)과도 맞는다.
appId: com.zto.desktop
productName: ZTO
copyright: © Dan

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: launch/scripts
    to: launch/scripts
  - from: launch/questionnaires
    to: launch/questionnaires

mac:
  category: public.app-category.developer-tools
  # 파일명에 버전을 넣지 않는다 — 사이트 다운로드 버튼이 releases/latest/download/ZTO-arm64.dmg
  # 고정 URL을 쓸 수 있게(버전은 릴리스 태그가 이미 말한다). 자산은 릴리스별로 격리되므로 안 섞인다
  artifactName: 'ZTO-${arch}.${ext}'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # 자동 업데이트(후속)가 zip을 쓴다
      arch: [arm64, x64]
  # 공증에 필요 — 하드닝 런타임 + 엔타이틀먼트. Electron은 JIT를 쓰므로 허용 항목이 필요하다
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 공증: 환경변수 APPLE_ID · APPLE_APP_SPECIFIC_PASSWORD · APPLE_TEAM_ID 필요
  notarize: true

win:
  target:
    - target: nsis
      arch: [x64]
  # 코드 서명 인증서가 없으면 미서명으로 나간다(설치 시 SmartScreen 경고).
  # 인증서가 생기면 CSC_LINK · CSC_KEY_PASSWORD 환경변수로 붙인다

# 업데이트 채널(publish)은 **이 파일에 두지 않는다.** ${env.X}는 변수가 없으면 빌드가 죽는데,
# 그 변수를 알 이유가 없는 소스 빌더의 `npm run dist:mac`이 첫 명령에서 넘어지게 된다.
# 채널은 공식 빌드에만 필요하므로 CI 워크플로(release.yml)와 dist:mac:official 스크립트가
# `-c.publish.provider=generic -c.publish.url=$ZTO_UPDATE_URL`로 직접 주입한다.
# 소스 빌드엔 app-update.yml이 안 구워지고, updater는 이를 감지해 "비활성"으로 동작한다.
# ⚠️ `publish: null`은 장식이 아니다 — 없애면 electron-builder가 git remote로 GitHub provider를
# **자동 추론**해서, 미서명 소스 빌드가 릴리스를 받았다가 설치에 실패하는 UX가 생긴다(실측).
# ⚠️ macOS 자동 업데이트는 **서명된 앱에서만** 동작한다(Squirrel.Mac 요구). 미서명 빌드는 못 받는다.
publish: null

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
